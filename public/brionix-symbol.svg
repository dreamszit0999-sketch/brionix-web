<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
<title id="title">Brionix Systems — monograma y luciérnaga</title><desc id="desc">Monograma B tridimensional de acero cepillado, recorrido dorado y luciérnaga geométrica de alas reticulares.</desc>
<defs>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".18" stop-color="#8095a8"/><stop offset=".38" stop-color="#f4f7fa"/><stop offset=".63" stop-color="#9bafc0"/><stop offset=".82" stop-color="#e6edf2"/><stop offset="1" stop-color="#61788c"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38516a"/><stop offset=".55" stop-color="#b8c8d4"/><stop offset="1" stop-color="#536c82"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4c9"/><stop offset=".35" stop-color="#ffc35a"/><stop offset=".72" stop-color="#ee922b"/><stop offset="1" stop-color="#8f4b19"/></linearGradient>
 <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9f2ff" stop-opacity=".9"/><stop offset=".6" stop-color="#8eb9d4" stop-opacity=".18"/><stop offset="1" stop-color="#ffc65f" stop-opacity=".65"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ffd36f" stop-opacity=".75"/><stop offset="1" stop-color="#f5a53c" stop-opacity="0"/></radialGradient>
 <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<ellipse cx="207" cy="350" rx="150" ry="20" fill="#000" opacity=".42" filter="url(#shadow)"/>
