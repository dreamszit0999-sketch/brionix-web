<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="t d">
<title id="t">Brionix Systems — luciérnaga</title>
<desc id="d">Luciérnaga estilizada de cuerpo segmentado, seis patas, antenas, alas transparentes azul eléctrico y abdomen ámbar luminoso.</desc>
<defs>
 <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaffff" stop-opacity=".92"/><stop offset=".42" stop-color="#55d5ff" stop-opacity=".72"/><stop offset="1" stop-color="#1477c2" stop-opacity=".18"/></linearGradient>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fdff"/><stop offset=".42" stop-color="#8fb9ce"/><stop offset="1" stop-color="#234e70"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fffde7"/><stop offset=".22" stop-color="#fff0b7"/><stop offset=".53" stop-color="#ffc15b"/><stop offset="1" stop-color="#ff9a30" stop-opacity="0"/></radialGradient>
 <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="lightGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
 <!-- rear wings: two distinct, narrow insect wings rather than butterfly petals -->
 <path d="M143 116C111 69 72 37 43 47C22 55 35 91 74 118C94 132 119 139 145 137Z" fill="url(#wing)" stroke="#8be8ff" stroke-width="2.4" filter="url(#blueGlow)"/>
 <path d="M177 116C209 69 248 37 277 47C298 55 285 91 246 118C226 132 201 139 175 137Z" fill="url(#wing)" stroke="#8be8ff" stroke-width="2.4" filter="url(#blueGlow)"/>
 <path d="M146 129C109 119 76 124 65 146C56 166 82 177 111 164L151 145Z" fill="#168bc9" fill-opacity=".22" stroke="#50cfff" stroke-width="1.8"/>
 <path d="M174 129C211 119 244 124 255 146C264 166 238 177 209 164L169 145Z" fill="#168bc9" fill-opacity=".22" stroke="#50cfff" stroke-width="1.8"/>
 <!-- wing veins -->
 <g fill="none" stroke="#d9f9ff" stroke-opacity=".78" stroke-width="1.25">
  <path d="M151 128Q101 82 48 53M146 134Q91 119 42 83M169 128Q219 82 272 53M174 134Q229 119 278 83"/>
  <path d="M148 139Q105 143 72 158M172 139Q215 143 248 158"/>
 </g>
 <!-- antennae -->
 <path d="M151 93Q139 67 127 55M169 93Q181 67 193 55" fill="none" stroke="#9cecff" stroke-width="2"/>
 <circle cx="126" cy="53" r="3" fill="#d9faff"/><circle cx="194" cy="53" r="3" fill="#d9faff"/>
 <!-- head and thorax -->
 <ellipse cx="160" cy="101" rx="11" ry="12" fill="url(#shell)" stroke="#d8f7ff" stroke-width="1.4"/>
 <path d="M151 112Q160 107 169 112L176 155Q160 167 144 155Z" fill="url(#shell)" stroke="#c8efff" stroke-width="1.5"/>
 <path d="M148 125Q160 131 172 125M146 141Q160 148 174 141" fill="none" stroke="#f2fdff" stroke-opacity=".7" stroke-width="1.2"/>
 <!-- six articulated legs -->
 <g fill="none" stroke="#77dfff" stroke-width="2">
  <path d="M148 124L127 144L112 158M172 124L193 144L208 158"/>
  <path d="M146 139L124 158L113 178M174 139L196 158L207 178"/>
  <path d="M148 151L135 174L128 190M172 151L185 174L192 190"/>
 </g>
 <!-- segmented abdomen and living amber light -->
 <path d="M148 158Q160 166 172 158L170 202Q160 216 150 202Z" fill="url(#shell)" stroke="#bcecff" stroke-width="1.4"/>
 <path d="M151 172Q160 177 169 172M151 184Q160 189 169 184" fill="none" stroke="#f0fbff" stroke-opacity=".62" stroke-width="1.1"/>
 <ellipse cx="160" cy="205" rx="28" ry="31" fill="#ffad43" opacity=".24" filter="url(#lightGlow)"/>
 <path d="M150 197Q160 190 170 197L169 216Q160 229 151 216Z" fill="url(#glow)" stroke="#ffd28a" stroke-width="1.3" filter="url(#lightGlow)"/>
 <ellipse cx="160" cy="207" rx="5.5" ry="9" fill="#fffbe5" filter="url(#lightGlow)"/>
 <g fill="none" stroke="#ffc36a" stroke-width="1.5" opacity=".9">
  <path d="M160 235V249M145 226L137 236M175 226L183 236"/>
 </g>
</g>
</svg>