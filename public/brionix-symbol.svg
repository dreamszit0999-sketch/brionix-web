<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="t d">
<title id="t">Brionix Systems — Firefly intelligence mark</title>
<desc id="d">Emblema refinado de luciérnaga tecnológica, con cuatro alas estilizadas en cian eléctrico, cuerpo metálico y una luz ámbar brillante.</desc>
<defs>
 <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7fbff"/><stop offset=".3" stop-color="#73dcff"/><stop offset=".72" stop-color="#249bdc"/><stop offset="1" stop-color="#15578f"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b8f5ff"/><stop offset=".5" stop-color="#35caff"/><stop offset="1" stop-color="#1687ce"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1fdff"/><stop offset=".4" stop-color="#9bb9cb"/><stop offset="1" stop-color="#345b76"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#fffde7"/><stop offset=".18" stop-color="#fff0bd"/><stop offset=".45" stop-color="#ffc35e"/><stop offset=".8" stop-color="#ff9c35"/><stop offset="1" stop-color="#ff9c35" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="13"/></filter>
</defs>
<g transform="translate(0 3)" stroke-linecap="round" stroke-linejoin="round">
 <!-- swept upper wings -->
 <path d="M145 112C119 61 68 24 42 38C16 53 40 104 121 133C76 119 42 132 45 155C48 180 92 172 145 139Z" fill="url(#wing)" fill-opacity=".78" stroke="url(#edge)" stroke-width="2.8"/>
 <path d="M175 112C201 61 252 24 278 38C304 53 280 104 199 133C244 119 278 132 275 155C272 180 228 172 175 139Z" fill="url(#wing)" fill-opacity=".78" stroke="url(#edge)" stroke-width="2.8"/>
 <!-- lower wing sweep -->
 <path d="M145 130C107 130 72 161 80 185C88 209 125 184 153 151Z" fill="#0e79b6" fill-opacity=".3" stroke="#53d4ff" stroke-width="2"/>
 <path d="M175 130C213 130 248 161 240 185C232 209 195 184 167 151Z" fill="#0e79b6" fill-opacity=".3" stroke="#53d4ff" stroke-width="2"/>
 <!-- wing veins -->
 <g fill="none" stroke="#d8f8ff" stroke-opacity=".75" stroke-width="1.5">
  <path d="M151 126C111 91 76 56 49 46M143 133C99 120 67 102 47 78M137 141C100 145 75 155 62 168"/>
  <path d="M169 126C209 91 244 56 271 46M177 133C221 120 253 102 273 78M183 141C220 145 245 155 258 168"/>
 </g>
 <g fill="none" stroke="#8ce8ff" stroke-opacity=".85" stroke-width="1">
  <path d="M150 123Q110 74 85 60M170 123Q210 74 235 60M143 135Q105 133 91 155M177 135Q215 133 229 155"/>
 </g>
 <!-- head, antennae and tapered thorax -->
 <path d="M150 105Q135 81 128 65M170 105Q185 81 192 65" fill="none" stroke="#83e5ff" stroke-width="2.5"/>
 <circle cx="127" cy="62" r="3" fill="#c9f8ff"/><circle cx="193" cy="62" r="3" fill="#c9f8ff"/>
 <ellipse cx="160" cy="105" rx="12" ry="13" fill="url(#body)" stroke="#d9f7ff" stroke-width="1.6"/>
 <path d="M150 116Q160 109 170 116L179 158Q160 177 141 158Z" fill="url(#body)" stroke="#b9eaff" stroke-width="1.8"/>
 <path d="M148 126Q160 134 172 126M145 145Q160 153 175 145" fill="none" stroke="#e6faff" stroke-opacity=".65" stroke-width="1"/>
 <!-- luminous abdomen -->
 <ellipse cx="160" cy="195" rx="34" ry="34" fill="#ffb347" opacity=".28" filter="url(#shine)"/>
 <path d="M144 160Q160 171 176 160L170 194Q160 207 150 194Z" fill="url(#light)" stroke="#ffd58b" stroke-width="1.5" filter="url(#glow)"/>
 <ellipse cx="160" cy="187" rx="7" ry="12" fill="#fff9df" filter="url(#glow)"/>
 <!-- small light rays -->
 <g fill="none" stroke="#ffbf62" stroke-width="1.5" opacity=".9">
  <path d="M160 214V231M145 209L136 220M175 209L184 220"/>
 </g>
</g>
</svg>