name: Validate multilingual portal

on:
  pull_request:
    branches:
      - feature/free-virtual-advisor
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/validate-multilingual.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
